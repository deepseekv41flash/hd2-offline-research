# HD2 阶段2 发现层 —— nginx 反代 vhost（模板）
#
# 由 deploy/discovery/install.sh --mode nginx 渲染安装（占位符 __DOMAIN__ / __CERT__ /
# __KEY__ / __UPSTREAM_PORT__ / __ACCESS_LOG__ / __ERROR_LOG__ 会被替换）。
# 业务机上 443 已被 BT 面板 nginx 占用时用这个形态：mock 只监听回环 8443，
# nginx 按 SNI/server_name 把本域名的请求转发给 mock，其他站点完全不受影响。
#
# 注意：本文件**不**包含 BT 的 WAF / php / 伪静态 include —— 只做纯反代。

server {
    listen 443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HD2DISC:10m;
    ssl_session_timeout 10m;

    access_log __ACCESS_LOG__;
    error_log  __ERROR_LOG__ warn;

    # 游戏 API 请求体很小；给足余量但不无限放大
    client_max_body_size 16m;

    location / {
        proxy_pass https://127.0.0.1:__UPSTREAM_PORT__;
        # 上游是本机 mock 的 2 天研究证书，不复用系统信任链
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 账号归属依赖真实客户端 IP（mock 在回环对端时采信这两个头）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
